version: 2.1
jobs:
  verify:
    docker:
      - image: node:26.13.0-bookworm
    steps:
      - checkout
      - run: npm ci --engine-strict
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run test:types
      - run: npm run test:package
      - run: npm run doc
      - store_artifacts:
          path: coverage
workflows:
  verify:
    jobs:
      - verify
