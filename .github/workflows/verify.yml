name: Verify
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      nodes: ${{ steps.matrix.outputs.nodes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run test:types
      - run: npm run test:baseline
      - run: npm run test:package
      - run: npm run doc
      - name: Audit production and development dependencies
        run: |
          npm audit --omit=dev --audit-level=moderate --json > .artifacts/audit-production.json
          npm audit --audit-level=high --json > .artifacts/audit-all.json
      - id: matrix
        run: node -e 'console.log("nodes=" + JSON.stringify(require("./.github/node-versions.json")))' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-package
          path: .artifacts/*.tgz
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-evidence
          include-hidden-files: true
          path: |
            coverage
            .artifacts/audit-*.json
            .artifacts/baseline-results.json
  compatibility:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.build.outputs.nodes) }}
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-package
          path: .artifacts
      - run: node scripts/test-ci-runtime.js
